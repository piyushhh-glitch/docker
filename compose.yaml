services:

  mysql-db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: secret-pass
      MYSQL_DATABASE: ml_db
    ports:
      - "3307:3306"

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret-pass"]
      interval: 5s
      timeout: 5s
      retries: 10

  ml-app:
    build: .
    depends_on:
      mysql-db:
        condition: service_healthy